name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash tests/scripts/allowlist_check.sh Cargo.lock
      - run: bash tests/scripts/write_path_check.sh

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90.0"
      - run: cargo build --locked

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install --path . --locked --root "$RUNNER_TEMP/aw-install"
      - run: "$RUNNER_TEMP/aw-install/bin/aw" --version

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
      - run: cargo audit

  network-deny-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --release
      - run: |
          mkdir -p "$RUNNER_TEMP/aw-fixture"
          printf 'def f():\n    return 1\n' > "$RUNNER_TEMP/aw-fixture/a.py"
          bash tests/scripts/seatbelt-build.sh target/release/aw "$RUNNER_TEMP/aw-fixture"

  network-deny-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --release
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: network namespace denies egress (negative control first)
        run: |
          mkdir -p "$RUNNER_TEMP/aw-fixture"
          printf 'def f():\n    return 1\n' > "$RUNNER_TEMP/aw-fixture/a.py"
          if bwrap --unshare-net --dev-bind / / python3 -c \
            "import socket; socket.create_connection(('1.1.1.1',443),2)"; then
            echo "negative control reached the network — namespace not enforced" >&2
            exit 1
          fi
          bwrap --unshare-net --dev-bind / / target/release/aw build --root "$RUNNER_TEMP/aw-fixture"
          echo "G5 network-namespace: build ok, egress blocked — PASS"

  self-gt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: self ground truth (evidence vault only)
        run: |
          if [ ! -f docs/baselines/ground-truth-aw-self.md ]; then
            echo "no evidence vault in this tree — skipped"; exit 0
          fi
          cargo build --locked --release
          target/release/aw build --force
          python3 -I tests/scripts/precision_recall.py . target/release/aw docs/baselines/ground-truth-aw-self.md
