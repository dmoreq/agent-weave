name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_scan_5k_p95'
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_scan_10k_p95'
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_scan_hub_5k_p95'
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_d3_raw_5k_p95'
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_deep_shared_10k_p95'
      - run: cargo test --locked --test reuse_bench -- --list | grep -q 'bench_hash_16mib'
      - run: EG_BENCH_BIN=target/release/eg cargo test --locked --test reuse_bench -- --ignored --nocapture
      - run: python3 -I tests/scripts/test_recall_scorers.py
      - run: python3 -I tests/scripts/test_reuse_oracle.py
      - run: python3 -I tests/scripts/reuse_oracle.py --labels tests/fixtures/reuse/oracle-labels.csv --predictions tests/fixtures/reuse/oracle-predictions.csv --baseline tests/fixtures/reuse/oracle-baseline.csv --json
      - run: python3 -I tests/scripts/reuse_field_run.py docs/baselines/reuse-field-scan-20261114.json --check
      - run: python3 -I -B bench/test_run.py
      - run: python3 -I bench/run.py target/release/eg
      - run: bash tests/scripts/allowlist_check.sh Cargo.lock
      - run: bash tests/scripts/write_path_check.sh
      - run: bash tests/scripts/hygiene_check.sh

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90.0"
      - run: cargo build --locked

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install --path . --locked --root "$RUNNER_TEMP/eg-install"
      - run: $RUNNER_TEMP/eg-install/bin/eg --version

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  network-deny-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --release
      - run: |
          mkdir -p "$RUNNER_TEMP/eg-fixture"
          printf 'def f():\n    return 1\n' > "$RUNNER_TEMP/eg-fixture/a.py"
          bash tests/scripts/seatbelt-build.sh target/release/eg "$RUNNER_TEMP/eg-fixture"

  network-deny-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --release
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: network namespace denies egress (positive control + build)
        run: |
          mkdir -p "$RUNNER_TEMP/eg-fixture"
          printf 'def f():\n    return 1\n' > "$RUNNER_TEMP/eg-fixture/a.py"
          bash tests/scripts/linux-netns-build.sh target/release/eg "$RUNNER_TEMP/eg-fixture"

  self-gt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: self ground truth (evidence vault only)
        run: |
          gt="$(ls docs/baselines/ground-truth-*-self.md 2>/dev/null | head -1)"
          if [ -z "$gt" ]; then
            echo "no evidence vault in this tree — skipped"; exit 0
          fi
          cargo build --locked --release
          target/release/eg build --force
          python3 -I tests/scripts/precision_recall.py . target/release/eg "$gt"
