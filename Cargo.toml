[package]
name = "agent-weave"
version = "0.4.0"
edition = "2021"
description = "Local code knowledge index: who calls this, what does this call, what is impacted by this file."
license = "MIT OR Apache-2.0"
publish = false  # review pending; crates.io name is prepared as `agent-weave`
repository = "https://github.com/quy-doan/agent-weave"
homepage = "https://github.com/quy-doan/agent-weave"
documentation = "https://docs.rs/agent-weave"
readme = "README.md"
keywords = ["code-search", "call-graph", "mcp", "tree-sitter", "sqlite"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.90"
include = [
    "/src/**",
    "/bench/**",
    "/tests/*.rs",
    "/tests/scripts/timing_assert.sh",
    "/schema.sql",
    "/schema_indexes.sql",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[lib]
name = "agent_weave"
path = "src/lib.rs"

[[bin]]
name = "aw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
ignore = "0.4"
# MCP stdio boundary parses UNTRUSTED client JSON (Amendment 8): one audited
# parser instead of a hand-rolled one on a trust boundary; no async runtime.
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
