[package]
name = "kg"
version = "0.1.0"
edition = "2021"
description = "Local code knowledge index: who calls this, what does this call, what is impacted by this file."
license = "LicenseRef-Private"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
ignore = "0.4"
# MCP stdio boundary parses UNTRUSTED client JSON (Amendment 8): one audited
# parser instead of a hand-rolled one on a trust boundary; no async runtime.
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
