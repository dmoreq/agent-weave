[package]
name = "engram"
version = "1.0.0"
edition = "2021"
description = "Local deterministic code graph, real-time anti-reinvention engine, and zero-token persistent memory for AI coding agents."
license = "MIT OR Apache-2.0"
publish = false  # review pending; crates.io name is prepared as `engram`
repository = "https://github.com/dmoreq/engram"
homepage = "https://github.com/dmoreq/engram"
documentation = "https://docs.rs/engram"
readme = "README.md"
keywords = ["code-index", "call-graph", "anti-reinvention", "agent-memory", "mcp"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.90"
include = [
    "/src/**",
    "/bench/**",
    "/tests/*.rs",
    "/tests/cli/**",
    "/tests/fixtures/main.rs",
    "/tests/mcp/**",
    "/tests/bench/**",
    "/tests/scripts/timing_assert.sh",
    "/schema/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[lib]
name = "engram"
path = "src/lib.rs"

[[bin]]
name = "eg"
path = "src/main.rs"

[[test]]
name = "reuse_bench"
path = "tests/bench/reuse_bench.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
ignore = "0.4"
# MCP stdio boundary parses UNTRUSTED client JSON: one audited
# parser instead of a hand-rolled one on a trust boundary; no async runtime.
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
